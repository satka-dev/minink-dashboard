name: Génération Automatique Dashboard Minink

on:
  schedule:
    # S'exécute automatiquement toutes les heures
    - cron: '0/15 * * * *'
  # Permet aussi un déclenchement manuel dans l'interface GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupération du code
      uses: actions/checkout@v3

    - name: Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Génération de l'image BMP
      run: python generate_bmp.py

    - name: Déploiement sur GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
